services:
  ai-api:
    environment:
      LUMIERE_SEMANTIC_DST_ENABLED: "true"
      LUMIERE_SEMANTIC_PRICE_ENABLED: "false"
      LUMIERE_SEMANTIC_PRICE_URL: "http://host.docker.internal:11434/api/chat"
      LUMIERE_SEMANTIC_PRICE_MODEL: "qwen2.5:3b"
      LUMIERE_SEMANTIC_PRICE_KEEP_ALIVE: "10m"
      LUMIERE_SEMANTIC_PRICE_DEBUG: "false"
      LUMIERE_COMPACT_SHOPPING_RESPONSE_ENABLED: "true"
      LUMIERE_GROUNDED_NARRATIVE_ENABLED: "false"
      LUMIERE_CUSTOMER_DIALOGUE_ENABLED: "false"
      LUMIERE_SEMANTIC_PLANNER_ENABLED: "false"
