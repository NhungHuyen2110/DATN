# Independent synthetic-data test instance. No production volumes or credentials.
services:
  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/test-only-lumiere-2026
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:17687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test-only-lumiere-2026", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
