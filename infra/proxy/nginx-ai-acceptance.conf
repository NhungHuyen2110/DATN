error_log /var/log/nginx/error.log crit;
events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;
    server {
        listen 8080;
        location ^~ /api/internal/ { return 404; }
        location ^~ /ai/internal/ { return 404; }
        location /api/ {
            set $business business-qa:8001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$business;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }
        location /ai/ {
            set $ai ai-api:8000;
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://$ai;
            proxy_read_timeout 45s;
        }
        location / {
            set $frontend frontend:8080;
            proxy_pass http://$frontend;
        }
    }
}
