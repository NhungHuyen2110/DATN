server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { access_log off; return 200 'alive'; }
    location = /runtime-config.js {
        default_type application/javascript;
        add_header Cache-Control no-store;
        return 200 'window.LUMIERE_API_BASE=window.location.origin+"/api";window.LUMIERE_AI_BASE=window.location.origin+"/ai";';
    }
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /ai/ {
        proxy_pass http://ai:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 240s;
    }
    location / {
        # Existing HTML/pages remain unchanged; inject deployment configuration before deferred scripts execute.
        sub_filter_once on;
        sub_filter '</head>' '<script src="/runtime-config.js"></script></head>';
        try_files $uri $uri/ =404;
    }
}
