# Ordinary upstream errors include raw request lines, possibly reset-token
# query strings. Keep status/correlation/timing in the safe access log instead.
error_log /var/log/nginx/error.log crit;
events {}
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    log_format safe '$request_id $request_method $status $request_time';
    access_log /var/log/nginx/access.log safe;
    server {
        listen 8080;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;
        location = /health/live { access_log off; return 200 'alive'; }
        location ^~ /api/internal/ { return 404; }
        location ^~ /ai/internal/ { return 404; }
        location /grafana/ {
            set $grafana grafana:3000;
            proxy_pass http://$grafana;
            proxy_set_header Host $http_host;
        }
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            set $business business-api:8001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$business;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
        }
        location ~ ^/api/(admin|staff)/ai/(chat|retrieval-diagnostics)$ {
            limit_req zone=api burst=20 nodelay;
            set $business business-api:8001;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$business;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 50s;
        }
        location /ai/ {
            limit_req zone=api burst=20 nodelay;
            set $ai ai-api:8000;
            rewrite ^/ai/(.*)$ /$1 break;
            proxy_pass http://$ai;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 45s;
        }
        location / {
            set $frontend frontend:8080;
            proxy_pass http://$frontend;
            proxy_set_header Host $host;
        }
    }
}
