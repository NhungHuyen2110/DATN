server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location = /health/live { access_log off; return 200 'alive'; }
    location ~* (\.bak$|\.env|node_modules|package(-lock)?\.json) { return 404; }
    location / {
        sub_filter_types text/html;
        sub_filter '<head>' '<head><script src="/runtime-config.js"></script>';
        sub_filter_once on;
        try_files $uri $uri/ =404;
    }
}
