name: Final Demo Verification
on:
  push:
    branches:
      - feature/final-demo-polish
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript checks
        run: |
          node --check frontend/assets/js/site.js
          node --check frontend/assets/js/api.js
          node --check frontend/assets/js/backend-console.js
      - name: Compile Backend Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run mock payment and checkout tests without any external database access
        working-directory: backend
        env:
          POSTGRES_DB: ci_test_only
          POSTGRES_PASSWORD: ci_test_placeholder
        run: |
          python - <<'PY'
          import sqlalchemy as sa
          import unittest
          from unittest.mock import patch

          original = sa.engine.Engine.connect
          def sqlite_only(engine, *args, **kwargs):
              if engine.dialect.name != 'sqlite' or engine.url.database != ':memory:':
                  raise AssertionError('Only in-memory SQLite is allowed in CI')
              return original(engine, *args, **kwargs)

          with patch.object(sa.engine.Engine, 'connect', sqlite_only):
              suite = unittest.defaultTestLoader.discover('tests', pattern='test_payments_api.py')
              result = unittest.TextTestRunner(verbosity=1).run(suite)
              if not result.wasSuccessful():
                  raise SystemExit(1)
          PY
