name: lumiere-rebuild-test
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}
services:
  reverse-proxy:
    <<: *runtime
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${PUBLIC_PORT:-18080}:8080']
    volumes: ['./infra/proxy/nginx.conf:/etc/nginx/nginx.conf:ro']
    networks: [edge]
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health/live']
      interval: 15s
  frontend:
    <<: *runtime
    build: {context: ., dockerfile: frontend/Dockerfile}
    networks: [edge]
    mem_limit: 128m
  business-api:
    <<: *runtime
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:?Use explicit isolated env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set test user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set test password}
      PRODUCT_INDEX_SYNC_ENABLED: 'false'
      LUMIERE_METRICS_ENABLED: 'true'
      LUMIERE_METRICS_TOKEN: ${LUMIERE_METRICS_TOKEN:?Set scrape token}
      LUMIERE_AI_DIAGNOSTICS_TOKEN: ${LUMIERE_AI_DIAGNOSTICS_TOKEN:?Set diagnostics token}
      LUMIERE_AI_INTERNAL_URL: http://ai-api:8000
      CORS_ORIGINS: http://localhost:${PUBLIC_PORT:-18080},http://127.0.0.1:${PUBLIC_PORT:-18080}
    networks: [edge, business-data, monitoring]
    mem_limit: 768m
    depends_on:
      postgres: {condition: service_healthy}
  ai-api:
    <<: *runtime
    build: {context: ., dockerfile: AI/Dockerfile}
    environment:
      BUSINESS_API_URL: http://business-api:8001
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jewelry_products}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set isolated graph password}
      LUMIERE_RETRIEVAL_V2_ENABLED: 'true'
      LUMIERE_RETRIEVAL_LIMITS_ENABLED: 'true'
      LUMIERE_AI_DIAGNOSTICS_TOKEN: ${LUMIERE_AI_DIAGNOSTICS_TOKEN:?Set diagnostics token}
      LUMIERE_METRICS_ENABLED: 'true'
      LUMIERE_METRICS_TOKEN: ${LUMIERE_METRICS_TOKEN:?Set scrape token}
    volumes: ['${MODEL_CACHE_PATH:-./.local-tmp/models}:/models:ro']
    networks: [edge, ai-data, monitoring]
    mem_limit: 3g
  postgres:
    <<: *runtime
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [rebuild_postgres:/var/lib/postgresql/data]
    networks: [business-data]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  index-worker:
    <<: *runtime
    profiles: [sync]
    build: {context: ., dockerfile: infra/index-worker.Dockerfile}
    environment:
      LUMIERE_SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LUMIERE_SYNC_NEO4J_URI: bolt://neo4j:7687
      LUMIERE_SYNC_QDRANT_URL: http://qdrant:6333
      LUMIERE_SYNC_GRAPH_PASSWORD: ${NEO4J_PASSWORD}
      LUMIERE_SYNC_MODEL_PATH: /models/hub/models--sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2/snapshots/e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      LUMIERE_SYNC_MODEL_REVISION: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      LUMIERE_WORKER_METRICS_PORT: '9101'
      LUMIERE_WORKER_METRICS_HOST: 0.0.0.0
      LUMIERE_METRICS_TOKEN: ${LUMIERE_METRICS_TOKEN}
    volumes:
      - ${MODEL_CACHE_PATH:-./.local-tmp/models}:/models:ro
      - ${SYNC_BACKUP_DIRECTORY:-./.local-tmp/recovery}:/recovery:ro
    networks: [business-data, ai-data, monitoring]
    mem_limit: 3g
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
  qdrant:
    <<: *runtime
    image: qdrant/qdrant:v1.18.3
    volumes: [rebuild_qdrant:/qdrant/storage]
    networks: [ai-data]
    mem_limit: 1g
  neo4j:
    <<: *runtime
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [rebuild_neo4j:/data, rebuild_neo4j_logs:/logs]
    networks: [ai-data]
    mem_limit: 1536m
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1"']
      interval: 15s
      timeout: 10s
      retries: 15
  ollama:
    <<: *runtime
    image: ollama/ollama:0.13.0
    profiles: [llm]
    volumes: [rebuild_ollama:/root/.ollama]
    networks: [ai-data]
    mem_limit: 8g
  prometheus:
    <<: *runtime
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes: ['./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro', rebuild_prometheus:/prometheus]
    networks: [monitoring]
    mem_limit: 512m
  grafana:
    <<: *runtime
    image: grafana/grafana:12.2.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set dashboard password}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:${PUBLIC_PORT:-18080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - rebuild_grafana:/var/lib/grafana
    networks: [edge, monitoring]
    mem_limit: 512m
networks:
  edge: {}
  business-data: {internal: true}
  ai-data: {internal: true}
  monitoring: {internal: true}
volumes:
  rebuild_postgres: {}
  rebuild_qdrant: {}
  rebuild_neo4j: {}
  rebuild_neo4j_logs: {}
  rebuild_ollama: {}
  rebuild_prometheus: {}
  rebuild_grafana: {}
