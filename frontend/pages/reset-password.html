<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đặt lại mật khẩu | LUMIÈRE</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/site.css">
<script src="../assets/js/api.js"></script>
</head>
<body style="background:#f8f5ef;color:#2c2925;font-family:Arial,sans-serif">
<main style="max-width:520px;margin:9vh auto;padding:38px;background:white;box-shadow:0 12px 30px #0001">
<div style="letter-spacing:.3em;color:#a98953;font-size:13px">LUMIÈRE</div>
<h1>Đặt lại mật khẩu</h1>
<p>Liên kết có hiệu lực trong 15 phút và chỉ sử dụng một lần.</p>
<form id="reset-form">
<label for="new-password">Mật khẩu mới</label>
<input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required style="display:block;width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">
<label for="confirm-password">Nhập lại mật khẩu</label>
<input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required style="display:block;width:100%;padding:12px;margin:8px 0 18px;box-sizing:border-box">
<button type="submit" style="padding:14px 25px;background:#292722;color:white;border:0;cursor:pointer">Đổi mật khẩu</button>
</form>
<p id="feedback" role="status" aria-live="polite"></p>
<p><a href="login.html">Quay về đăng nhập</a></p>
</main>
<script>
const form = document.getElementById('reset-form');
const feedback = document.getElementById('feedback');
const token = new URLSearchParams(location.search).get('token');
if (!token) { feedback.textContent = 'Thiếu liên kết khôi phục hợp lệ.'; form.querySelector('button').disabled = true; }
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('new-password').value;
  if (password !== document.getElementById('confirm-password').value) { feedback.textContent='Mật khẩu nhập lại không khớp.'; return; }
  const button = form.querySelector('button'); button.disabled = true;
  try {
    await window.LUMIERE_API.request('/auth/reset-password', {method:'POST', body:JSON.stringify({token,new_password:password})});
    feedback.textContent = 'Đổi mật khẩu thành công. Vui lòng đăng nhập lại.';
    history.replaceState(null, '', location.pathname);
    form.reset(); form.style.display = 'none';
  } catch (err) { feedback.textContent = err.message; button.disabled = false; }
});
</script>
</body>
</html>
