# Prepared demo hosting only. Requires generated private configuration,
# a new migrated/seeded demo DB, backup reference and model cache before activation.
name: lumiere-demo-hosting
services:
  tls-proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set an owned demo hostname}
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - demo_tls_data:/data
      - demo_tls_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    mem_limit: 128m
  business-api:
    environment:
      PRODUCT_INDEX_SYNC_ENABLED: 'true'
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: https://${DEMO_DOMAIN}
      PASSWORD_RESET_BASE_URL: https://${DEMO_DOMAIN}
      PASSWORD_RESET_DEMO_MODE: 'false'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
  index-worker:
    volumes:
      - ./private/recovery:/recovery:ro
  prometheus:
    volumes:
      - ./private/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./private/metrics.token:/run/secrets/metrics.token:ro
  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://${DEMO_DOMAIN}/grafana/
      GF_SECURITY_COOKIE_SECURE: 'true'
volumes:
  demo_tls_data: {}
  demo_tls_config: {}
