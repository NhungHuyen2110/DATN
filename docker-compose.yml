
services:
  postgres:
    image: postgres:17
    container_name: lumiere-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lumiere_db
      POSTGRES_USER: lumiere_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - lumiere_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U lumiere_user -d lumiere_db
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lumiere_postgres_data:
